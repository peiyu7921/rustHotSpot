[package]
name = "rust-hotspot"
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
description = "Windows Wi-Fi hotspot with hidden SSID, 2.4/5 GHz band selection and static DHCP leases"

[[bin]]
name = "rust-hotspot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
charis-ui = { version = "0.1", default-features = false, features = [
    "window",
    "gpu",
    "bundled-fonts",
    "clipboard",
    "accessibility",
] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
qrcode = "0.14"
windows = { version = "0.62", features = [
    "Devices_WiFiDirect",
    "Foundation",
    "Foundation_Collections",
    "Networking_Connectivity",
    "Networking_NetworkOperators",
    "Security_Credentials",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
